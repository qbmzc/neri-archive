services:
  archive:
    build: .
    image: neri-archive:local
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (12 or more characters)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOWNLOAD_PARALLELISM: ${DOWNLOAD_PARALLELISM:-2}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - archive-data:/data
      - ${MUSIC_PATH:-./music}:/music
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  archive-data:
