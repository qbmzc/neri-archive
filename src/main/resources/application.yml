server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        same-site: strict
        http-only: true
        secure: ${COOKIE_SECURE:false}
spring:
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: jdbc:sqlite:${ARCHIVE_DATA:./data}/archive.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA foreign_keys=ON
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null
archive:
  data: ${ARCHIVE_DATA:./data}
  music: ${ARCHIVE_MUSIC:./music}
  # 回收站留空表示 <archive.music>/.trash。这两项必须显式映射：
  # @Value 走的是 Spring 的宽松绑定，archive.superseded-retention-days 只会去找
  # ARCHIVE_SUPERSEDED_RETENTION_DAYS，而不是 SUPERSEDED_RETENTION_DAYS。
  trash: ${ARCHIVE_TRASH:}
  superseded-retention-days: ${SUPERSEDED_RETENTION_DAYS:7}
  admin-password: ${ADMIN_PASSWORD:}
  parallelism: ${DOWNLOAD_PARALLELISM:2}
  ffmpeg: ${FFMPEG:ffmpeg}
  ffprobe: ${FFPROBE:ffprobe}
  fpcalc: ${FPCALC:fpcalc}
  scheduling: ${ARCHIVE_SCHEDULING:true}
  duplicate-scan-on-startup: ${DUPLICATE_SCAN_ON_STARTUP:true}
